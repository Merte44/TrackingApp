<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Eigene Lebensmittel — Liste</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#007AFF}a:hover{color:#0062CC}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #000000; font-family: -apple-system, 'SF Pro Text', system-ui, sans-serif; color: #000000;">
<div style="position: absolute; left: 16px; right: 16px; top: 44px; height: 30px; border-radius: 12px; background: linear-gradient(to bottom, #E1F1FB, #EBEBF0); opacity: 0.55;"></div>
<div style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; border-radius: 12px 12px 0 0; background: #EBEBF0; display: flex; flex-direction: column;">
<div style="display: flex; justify-content: center; padding-top: 6px;"><div style="width: 36px; height: 5px; border-radius: 3px; background: #C6C6C8;"></div></div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 48px; padding: 0 8px 0 16px;">
<div style="width: 44px;"></div>
<h1 style="margin: 0; font-size: 17px; line-height: 22px; font-weight: 600;">Eigene Lebensmittel</h1>
<button aria-label="Neues Lebensmittel" style="width: 44px; height: 44px; border: 0; background: transparent; padding: 0; display: flex; align-items: center; justify-content: center; color: #007AFF; cursor: pointer;"><svg width="22" height="22" viewBox="0 0 22 22" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M11 3v16M3 11h16"></path></svg></button>
</div>
<div style="padding: 0 16px 12px;">
<label style="display: flex; align-items: center; gap: 6px; height: 36px; padding: 0 8px; border-radius: 12px; background: #E5E5EA; color: #8A8A8E;">
<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="7" cy="7" r="5"></circle><path d="M11 11l3.5 3.5"></path></svg>
<input type="search" placeholder="Suchen" aria-label="Lebensmittel suchen" style="flex: 1; border: 0; background: transparent; font: inherit; font-size: 17px; color: #000000; outline: none;">
</label>
</div>
<div style="margin: 0 16px; border-radius: 14px; background: #FFFFFF; overflow: hidden;">
<sc-for list="{{foods}}" as="f" hint-placeholder-count="7">
<button style="width: 100%; min-height: 60px; border: 0; background: transparent; padding: 0 0 0 16px; display: flex; align-items: center; text-align: left; font: inherit; cursor: pointer;">
<div style="flex: 1; display: flex; flex-direction: column; gap: 2px; padding: 9px 16px 9px 0; border-bottom: {{f.border}};">
<span style="font-size: 17px; line-height: 22px; font-weight: 600; color: #000000;">{{f.name}}</span>
<span style="font-size: 13px; line-height: 18px; color: #8A8A8E; font-variant-numeric: tabular-nums;">{{f.kcal}} kcal · <span style="color: #30B0C7; font-weight: 600;">C</span> {{f.c}} · <span style="color: #AF52DE; font-weight: 600;">F</span> {{f.f}} · <span style="color: #FF9500; font-weight: 600;">E</span> {{f.e}} <span>pro 100 g</span></span>
</div>
</button>
</sc-for>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const rows = [
['Äpfel', '52', '11,4', '0,2', '0,3'],
['Banane', '89', '20', '0,2', '1,1'],
['Erdnussbutter', '640', '12', '50', '25'],
['Haferflocken', '372', '58,7', '7', '13,5'],
['Magerquark', '67', '4', '0,3', '12'],
['Skyr', '63', '4', '0,2', '11'],
['Vollkornbrot', '220', '38', '1,8', '7,5']
];
return {
foods: rows.map((r, i) => ({ name: r[0], kcal: r[1], c: r[2], f: r[3], e: r[4], border: i === rows.length - 1 ? '0' : '0.5px solid #C6C6C8' }))
};
}
}
</script>
</body>
</html>
